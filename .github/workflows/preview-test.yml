name: Build Bichen installable preview
on:
  workflow_dispatch:
  push:
    branches: ['improve/cname-profiles-20260913']
    paths: ['tools/build_preview.py', '.github/workflows/preview-test.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile isolated preview and run regressions
        run: python3 tools/build_preview.py
      - name: Upload unsigned handoff for private local signing
        uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.3.0-test.2-signing-handoff
          path: |
            out/preview/Bichen-0.3.0-test.2-unsigned.apk
            out/preview/Bichen-0.3.0-test.2-source.zip
            out/preview/Bichen-0.3.0-beta.1-module.zip
            out/preview/apksigner.jar
            out/preview/build-info.json
            out/preview/apk-badging.txt
            out/preview/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
