name: Verify Bichen preview on Android
on:
  workflow_dispatch:
  push:
    branches: ['improve/cname-profiles-20260913']
    paths: ['.github/workflows/repair-test3.yml', 'tools/test_device.py', 'tests/device/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile exact test3 and run regressions
        run: python3 tools/build_preview.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK and verify Android screens and module handoff
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            python3 tools/test_device.py
      - name: Preserve unsigned internal build and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-test3-UNSIGNED-not-installable
          path: |
            out/preview/Bichen-0.3.0-test.3-unsigned.apk
            out/preview/Bichen-0.3.0-beta.1-module.zip
            out/preview/apksigner.jar
            out/preview/build-info.json
            out/preview/apk-badging.txt
            out/device/device-results.txt
            out/device/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
